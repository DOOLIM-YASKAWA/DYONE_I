<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>공장 허브 시안</title>
<style>
:root{
  --bg:#eef0f3; --card:#fff; --line:#e3e6eb; --line2:#f0f2f5; --text:#1d2330; --sub:#6b7280; --faint:#9aa1ad;
  --accent:#2457d6; --accent-soft:#e8eefc; --ok:#e3f6e8; --ok-text:#17803d; --warn:#fff1e6; --warn-text:#b54708; --bad:#fde8e8; --bad-text:#b42318;
  --srs:#0e7490; --srs-soft:#dff3f7; --ms:#7c3aed; --ms-soft:#f1eafe; --lab:#b45309; --lab-soft:#fdf1e2; --pj:#475569; --pj-soft:#eef1f5; --spec:#15803d; --spec-soft:#e6f5ea;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:13.5px/1.5 "Pretendard","Malgun Gothic",system-ui,sans-serif}
button{font:inherit;cursor:pointer;color:inherit}
.shell{display:grid;grid-template-columns:62px 262px minmax(0,1fr);min-height:100vh}
/* 전역 메뉴 */
.gnav{background:#1f2633;color:#aab3c2;display:flex;flex-direction:column;align-items:center;padding:10px 0;gap:3px;position:sticky;top:0;height:100vh}
.gnav .logo{color:#fff;font-weight:800;font-size:11px;margin-bottom:10px;text-align:center;line-height:1.1}
.gnav a{width:50px;padding:6px 0;border-radius:8px;text-align:center;font-size:10px;color:inherit;text-decoration:none;position:relative}
.gnav a b{display:block;font-size:16px;font-weight:400}
.gnav a:hover{background:#2b3446}
.gnav a.on{background:var(--accent);color:#fff}
.gnav a.new::after{content:"NEW";position:absolute;top:-3px;right:-3px;background:#f59e0b;color:#fff;font-size:8px;padding:0 3px;border-radius:4px}
/* 공장 목록 */
.flist{background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;height:100vh;position:sticky;top:0}
.flist .head{padding:14px 14px 8px;border-bottom:1px solid var(--line2)}
.flist h2{margin:0 0 8px;font-size:15px;display:flex;justify-content:space-between;align-items:baseline}
.flist h2 small{font-weight:400;color:var(--faint);font-size:11.5px}
.flist input{width:100%;padding:7px 10px;border:1px solid var(--line);border-radius:7px;font:inherit}
.chips{display:flex;gap:5px;margin-top:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:#fff;border-radius:20px;padding:1px 9px;font-size:11.5px;color:var(--sub)}
.chip.on{background:var(--accent-soft);border-color:#bcd0f7;color:var(--accent);font-weight:600}
.flist .scroll{overflow-y:auto;flex:1;padding:0 8px 12px}
.cust{font-size:10.5px;color:var(--faint);margin:10px 6px 3px;font-weight:700;letter-spacing:.04em}
.fac{display:block;width:100%;text-align:left;border:0;background:none;padding:6px 8px;border-radius:7px}
.fac:hover{background:#f4f6f9}
.fac.on{background:var(--accent-soft);box-shadow:inset 3px 0 0 var(--accent)}
.fac .nm{display:flex;justify-content:space-between;gap:6px;font-weight:600;font-size:12.5px}
.fac .nm i{font-style:normal;font-size:10px;color:var(--accent);background:#fff;border:1px solid #bcd0f7;border-radius:4px;padding:0 4px;font-weight:600}
.badges{display:flex;gap:3px;margin-top:2px;flex-wrap:wrap}
.bd{font-size:10.5px;border-radius:4px;padding:0 5px;line-height:17px;white-space:nowrap}
.bd.srs{background:var(--srs-soft);color:var(--srs)} .bd.ms{background:var(--ms-soft);color:var(--ms)}
.bd.pj{background:var(--pj-soft);color:var(--pj)} .bd.lab{background:var(--lab-soft);color:var(--lab)} .bd.spec{background:var(--spec-soft);color:var(--spec)}
.bd.warn{background:var(--warn);color:var(--warn-text)} .bd.bad{background:var(--bad);color:var(--bad-text)} .bd.ok{background:var(--ok);color:var(--ok-text)}
.bd.zero{opacity:.4}
/* 본문 */
.main{min-width:0;display:flex;flex-direction:column}
.top{background:#fff;border-bottom:1px solid var(--line);padding:12px 22px 0;position:sticky;top:0;z-index:5}
.crumb{font-size:12px;color:var(--sub)}
.title{display:flex;align-items:center;gap:8px;margin:2px 0 8px;flex-wrap:wrap}
.title h1{margin:0;font-size:20px}
.tag{font-size:11px;background:var(--pj-soft);border-radius:5px;padding:1px 7px;color:var(--pj)}
.alias{font-size:11px;color:var(--sub)}
.alias span{border:1px dashed #c9cfd8;border-radius:4px;padding:0 5px;margin-left:3px}
.sp{flex:1}
.btn{border:1px solid var(--line);background:#fff;border-radius:7px;padding:4px 10px;font-size:12.5px;white-space:nowrap}
.btn:hover{background:#f7f8fa}
.btn.srs{border-color:#a6d8e3;color:var(--srs);background:var(--srs-soft)}
.btn.ms{border-color:#d4c2fb;color:var(--ms);background:var(--ms-soft)}
.btn.lab{border-color:#f0cf9f;color:var(--lab);background:var(--lab-soft)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;margin-bottom:10px}
.kpi{border:1px solid var(--line);border-radius:10px;padding:7px 11px;background:#fbfcfd;text-align:left}
.kpi:hover{border-color:#bcd0f7}
.kpi .l{font-size:11px;color:var(--sub)}
.kpi .v{font-size:18px;font-weight:700;line-height:1.3}
.kpi .s{font-size:10.5px;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi.srs .v{color:var(--srs)} .kpi.ms .v{color:var(--ms)} .kpi.lab .v{color:var(--lab)} .kpi.spec .v{color:var(--spec)}
.tabs{display:flex;gap:0;overflow-x:auto}
.tab{border:0;background:none;padding:8px 13px;border-bottom:2px solid transparent;color:var(--sub);font-weight:600;white-space:nowrap}
.tab.on{color:var(--accent);border-bottom-color:var(--accent)}
.tab[disabled]{color:#c3c8d0;cursor:not-allowed}
.tab small{font-weight:400;font-size:10.5px;margin-left:2px}
.tab .n{font-weight:400;font-size:11px;color:var(--faint);margin-left:3px}
.body{padding:14px 22px 60px;display:grid;grid-template-columns:minmax(0,1fr);gap:14px;align-items:start}
.body.withdrawer{grid-template-columns:minmax(0,1fr) 350px}
.col{display:grid;gap:14px;min-width:0}
.grid2{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:14px}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;min-width:0}
.card h3{margin:0;font-size:13.5px;padding:9px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card h3 .cnt{font-weight:400;color:var(--sub);font-size:12px}
.card h3 .sp{flex:1}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th,td{padding:6px 10px;border-bottom:1px solid var(--line2);text-align:left;vertical-align:top}
th{font-size:11px;color:var(--sub);font-weight:600;background:#fafbfc;white-space:nowrap}
tbody tr.click{cursor:pointer}
tbody tr.click:hover{background:#f7f9fc}
tbody tr.sel{background:var(--accent-soft)}
td.num{text-align:right;font-variant-numeric:tabular-nums}
.zn{font-weight:600}
.mut{color:var(--sub);font-size:12px}
.fa{color:var(--faint)}
.none{color:#c0c5cd}
.pc{display:inline-block;white-space:nowrap;font-size:11px;background:var(--pj-soft);color:var(--pj);border-radius:4px;padding:0 5px;margin:1px 2px 1px 0}
.pc.cur{background:var(--ok);color:var(--ok-text)}
.st{display:inline-block;font-size:11px;border-radius:4px;padding:0 6px;white-space:nowrap}
.st.수주{background:var(--ok);color:var(--ok-text)} .st.마감{background:var(--pj-soft);color:var(--pj)} .st.영업중{background:var(--accent-soft);color:var(--accent)} .st.none{background:#f3f4f6;color:var(--faint)}
.go{display:flex;gap:4px;flex-wrap:wrap}
.go button{border:1px solid var(--line);background:#fff;border-radius:6px;font-size:11px;padding:0 6px;line-height:20px}
.go .s{color:var(--srs)} .go .m{color:var(--ms)} .go .l{color:var(--lab)}
.go button[disabled]{opacity:.35;cursor:not-allowed}
.note{background:#fffbea;border:1px solid #f1e3a6;border-radius:10px;padding:8px 12px;font-size:12.5px;color:#6b5810}
.toolbar{display:flex;gap:6px;align-items:center;padding:8px 14px;border-bottom:1px solid var(--line2);flex-wrap:wrap}
.toolbar input{padding:4px 8px;border:1px solid var(--line);border-radius:6px;font:inherit;font-size:12.5px;width:180px}
/* 커버리지 맵 */
.cov{padding:10px 14px 12px;display:grid;gap:8px}
.covrow{display:grid;grid-template-columns:130px 1fr;gap:8px;align-items:start}
.covrow .bn{font-size:11.5px;font-weight:700;color:var(--sub);padding-top:4px}
.cells{display:flex;flex-wrap:wrap;gap:4px}
.zc{border:1px solid var(--line);border-radius:6px;padding:3px 6px 4px;background:#fff;min-width:92px;max-width:150px;text-align:left}
.zc:hover{border-color:var(--accent)}
.zc.sel{outline:2px solid var(--accent);outline-offset:1px}
.zc .zt{font-size:10.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.zc .dots{display:flex;gap:3px;margin-top:2px}
.dot{width:16px;height:6px;border-radius:2px;background:#eceef2}
.dot.p.on{background:#64748b} .dot.s.on{background:var(--srs)} .dot.m.on{background:var(--ms)} .dot.r.on{background:#9ca3af}
.dot.r.off{background:repeating-linear-gradient(45deg,#f6c4c4 0 2px,#fff 2px 4px)}
.legend{font-size:11px;color:var(--sub);display:flex;gap:12px;flex-wrap:wrap;padding:0 14px 10px}
.legend i{display:inline-block;width:14px;height:6px;border-radius:2px;margin-right:4px;vertical-align:middle}
/* 점검 */
.chk{padding:4px 14px 10px}
.chk .it{display:grid;grid-template-columns:20px 1fr auto;gap:8px;padding:7px 0;border-bottom:1px dashed var(--line2);align-items:start}
.chk .ic{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;margin-top:1px}
.chk .ic.w{background:var(--warn);color:var(--warn-text)} .chk .ic.b{background:var(--bad);color:var(--bad-text)} .chk .ic.i{background:var(--accent-soft);color:var(--accent)}
.chk b{font-weight:600}
/* 설비 요약 */
.eq{padding:8px 14px 12px;display:grid;gap:6px}
.eqr{display:grid;grid-template-columns:96px 1fr;gap:8px;font-size:12.5px;align-items:baseline}
.eqr .k{color:var(--sub);font-size:11.5px}
.mdl{display:inline-block;border:1px solid var(--line);border-radius:4px;padding:0 5px;margin:1px 3px 1px 0;font-size:11.5px;background:#fafbfc}
/* 타임라인 */
.tl{padding:4px 14px 12px}
.ev{display:grid;grid-template-columns:84px 22px 1fr;gap:6px;padding:6px 0;border-bottom:1px dashed var(--line2)}
.ev .d{color:var(--sub);font-size:12px}
.ev .i{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:10px;color:#fff;font-weight:700}
.ev .i.srs{background:var(--srs)} .ev .i.pj{background:#64748b} .ev .i.ms{background:var(--ms)} .ev .i.lab{background:var(--lab)} .ev .i.spec{background:var(--spec)}
/* 오른쪽 상세 */
.drawer{background:#fff;border:1px solid var(--line);border-radius:12px;position:sticky;top:150px;max-height:calc(100vh - 165px);overflow-y:auto}
.drawer .dh{padding:11px 14px;border-bottom:1px solid var(--line)}
.drawer .x{float:right;border:0;background:none;font-size:16px;color:var(--sub)}
.drawer h4{margin:0;font-size:15px}
.drawer .sec{padding:9px 14px;border-bottom:1px solid var(--line2)}
.drawer .lbl{font-size:11px;color:var(--sub);font-weight:700;margin-bottom:5px;display:flex;justify-content:space-between}
.drawer .acts{display:grid;gap:5px}
.drawer .acts .btn{text-align:left}
.robots{display:flex;flex-wrap:wrap;gap:3px}
.robots span{font-size:11px;border:1px solid var(--line);border-radius:4px;padding:0 5px}
.hist{font-size:12px;display:grid;gap:3px}
.hist .r{display:flex;justify-content:space-between;gap:8px}
.empty{padding:22px;text-align:center;color:var(--sub)}
.ph{padding:40px;text-align:center;color:var(--sub)}
.sub{display:flex;gap:4px;padding:8px 14px 0}
.sub button{border:1px solid var(--line);background:#fff;border-radius:20px;padding:1px 11px;font-size:12px}
.sub button.on{background:var(--text);color:#fff;border-color:var(--text)}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#1f2633;color:#fff;padding:8px 14px;border-radius:8px;font-size:12.5px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:20;max-width:90vw}
.foot{font-size:11px;color:var(--faint);padding:0 22px 20px}
@media (max-width:1250px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}.body.withdrawer{grid-template-columns:minmax(0,1fr)}.drawer{position:static;max-height:none}.grid2{grid-template-columns:minmax(0,1fr)}}
@media (max-width:800px){.shell{grid-template-columns:minmax(0,1fr)}.gnav{display:none}.flist{position:static;height:auto;max-height:300px}.top{position:static}.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.covrow{grid-template-columns:1fr}}
</style>
</head>

  return {zs,srs,cells,labs,lastSrs:srs.map(s=>s.date).sort().pop(),lastCell:cells.map(c=>c.date).sort().pop()};
}
function equipSummary(f){
  const u=(SPEC[f]?.units||[]).filter(x=>x.spray.length||x.atomizer.length||x.opener.length||x.fgp.length);
  const pick=k=>{const m=new Map();for(const x of u)for(const v of x[k]){if(!m.has(v))m.set(v,x.year)}return [...m].slice(0,4)};
  return {spray:pick('spray'),opener:pick('opener'),atomizer:pick('atomizer'),fgp:pick('fgp'),n:u.length};
}

  const units=sp.units.map(u=>`<tr><td>${u.year}</td><td>${u.projectCode?`<b>${u.projectCode}</b>`:'<span class="fa">—</span>'}</td><td>${esc(u.process||'—')} ${esc(u.part||'')}</td><td class="mut">${esc([u.paint,u.charge].filter(Boolean).join(' · ')||'—')}</td><td>${arr(u.spray)}</td><td>${arr(u.opener)}</td><td>${arr(u.atomizer)}</td><td>${arr(u.fgp)}</td><td><span class="bd ${u.sourceKind==='summary'?'spec':'pj'}">${u.sourceKind==='summary'?'사양정리':'도면'}</span></td></tr>`).join('');
  return `<div class="note">공장과 NAS 사양서는 <b>폴더 이름</b>으로만 이어집니다. 별칭(${ALIAS[cur].map(esc).join(', ')})으로 찾았고, 틀린 매칭은 '아님'으로 빼는 별칭 관리가 2차 작업입니다.</div>
  <div class="card"><h3>사양서 <span class="cnt">${sp.docsTotal}건 중 최근 ${sp.docs.length}건</span></h3><div class="tw"><table><thead><tr><th>연도</th><th>프로젝트 폴더</th><th>사양정리</th><th>고객 사양서</th><th>회의록</th><th></th></tr></thead><tbody>${docs}</tbody></table></div></div>
  <div class="card"><h3>공정별 설비 이력 <span class="cnt">${sp.unitsTotal}건 · 사양정리 표와 도면 제목에서 추출</span></h3><div class="tw"><table><thead><tr><th>연도</th><th>프로젝트</th><th>공정</th><th>도료 · 하전</th><th>도장 로봇</th><th>오프너</th><th>도장기</th><th>FGP</th><th>출처</th></tr></thead><tbody>${units}</tbody></table></div></div>`;
}

/* ── 탭: 활동 ── */
function events(){
  const S=stats(cur), ev=[];
  const g={};for(const s of S.srs){(g[s.date]??=[]).push(s)}
  for(const [d,a] of Object.entries(g)) ev.push([d,'srs','S',`SRS 측정 ${a.length}건 · ${[...new Set(a.map(x=>x.project).filter(Boolean))].join(', ')||'프로젝트 없음'}`,[...new Set(a.map(x=>x.booth+' / '+x.zone))].slice(0,4).join(', ')+(a.length>4?' …':'')]);
  for(const c of S.cells) ev.push([c.date,'ms','C',`MotoSim Cell 올림 · ${c.file}`,`${c.booth} / ${c.zone} · v${c.ver} · ${c.dept}${c.msg?' · '+c.msg:''}`]);
  for(const x of (SPEC[cur]?.docs||[])) if(x.modified) ev.push([x.modified,'spec','사',`사양정리 ${x.rev?x.rev+'판':''} · ${x.code||''}`,x.summary]);
  return ev.sort((a,b)=>b[0].localeCompare(a[0]));
}
function timeline(n){const e=events().slice(0,n||999);return `<div class="tl">${e.map(([d,c,i,a,b])=>`<div class="ev"><div class="d">${d}</div><div class="i ${c}">${i}</div><div><b>${esc(a)}</b><div class="mut">${esc(b)}</div></div></div>`).join('')||'<div class="empty">활동이 없습니다.</div>'}</div>`}
function actTab(){if(!DETAIL[cur]) return noDetail();return `<div class="card"><h3>활동 <span class="cnt">SRS 업로드 · MotoSim Cell · 사양정리 판 — 시간순</span></h3>${timeline()}</div>`}

/* ── 존 상세 ── */
function drawer(){
  const z=zonesOf(cur).find(x=>x.id===zoneSel); if(!z) return '';
  const d=DETAIL[cur], pr=PROC(z.name), pa=PART(z.name);
  const eq=(SPEC[cur]?.units||[]).filter(u=>pr&&u.process===pr&&(!pa||!u.part||u.part.includes(pa))&&(u.spray.length||u.atomizer.length)).slice(0,3);
  return `<aside class="drawer">
   <div class="dh"><button class="x" onclick="zoneSel=null;render()">✕</button><div class="crumb">${esc(z.booth)}</div><h4>${esc(z.name)}</h4><div class="mut">${esc(z.type||'TYPE 없음')} · 존 id ${z.id}</div></div>
   <div class="sec"><div class="lbl">바로가기</div><div class="acts">
     <button class="btn srs" ${z.srs.length?'':'disabled'} onclick="toast('SRS Analyzer ?zone=${z.id}&project=${z.srs[0]?.project||''}&measurement=${z.srs[0]?.id||''}')">▧ SRS Analyzer — 3D·통계·파라미터</button>
     <button class="btn ms" onclick="toast('MotoSim ?zone=${z.id} — Cell 받기/올리기')">◈ MotoSim — Cell ${z.cells.length?'받기 · ':''}올리기</button>
     <button class="btn" onclick="toast('공정 관리 — 이 존의 로봇 편집')">⚙ 공정 관리 — 로봇 · 존 편집</button>
   </div></div>
   <div class="sec"><div class="lbl"><span>로봇</span><span>${z.robots.length}대</span></div><div class="robots">${z.robots.map(r=>`<span>${esc(r)}</span>`).join('')||'<span class="bd bad">로봇 미등록</span>'}</div></div>
   <div class="sec"><div class="lbl"><span>연결 프로젝트</span><span>${z.projects.length}</span></div><div class="hist">${z.projects.map(p=>`<div class="r"><span><span class="pc ${d.projects[p]?.status==='수주'?'cur':''}">${p}</span> <span class="mut">${esc(d.projects[p]?.name||'')}</span></span></div>`).join('')||'<span class="none">없음</span>'}</div></div>
   <div class="sec"><div class="lbl"><span>SRS 측정</span><span>${z.srs.length}건</span></div><div class="hist">${z.srs.map(s=>`<div class="r"><span>${s.date} · ${s.project||'—'}</span><span class="mut">로봇 ${s.robots} · 차종 ${s.models} · 칼라 ${s.colors}</span></div>`).join('')||'<span class="none">없음</span>'}</div></div>
   <div class="sec"><div class="lbl"><span>MotoSim Cell</span><span>${z.cells.length}건</span></div><div class="hist">${z.cells.map(c=>`<div class="r"><span>${esc(c.file)} ${c.latest?'<span class="bd ok">최신</span>':''}</span><span class="mut">${c.date} v${c.ver}</span></div>`).join('')||'<span class="none">올린 Cell 없음</span>'}</div></div>
   <div class="sec"><div class="lbl"><span>같은 공정 설비 이력${pr?` (${pr}${pa?' '+pa:''})`:''}</span><span>사양</span></div><div class="hist">${eq.map(u=>`<div class="r"><span>${u.year} ${u.projectCode||''}</span><span class="mut">${esc([...u.spray,...u.atomizer].join(' · '))}</span></div>`).join('')||'<span class="none">맞는 이력 없음</span>'}</div></div>
  </aside>`;
}
function noDetail(){return `<div class="card"><div class="empty">시안에는 <b>KIA HWASEONG 3 · KIA GWANGJU 1 · HYUNDAI JEONJU TRUCK · GMK Bupyeong</b> 4곳만 상세 데이터를 넣었습니다.<br>실제 화면은 모든 공장이 같은 모양입니다.</div></div>`}

/* ── 그리기 ── */
function render(){
  renderList(); renderHead();
  const content={over:overTab,comp:compTab,proj:projTab,app:appTab,spec:specTab,act:actTab}[tab]();
  const dr=(tab==='comp'||tab==='app')?drawer():'';
  $('#body').className='body'+(dr?' withdrawer':'');
  $('#body').innerHTML=dr?`<div class="col">${content}</div>${dr}`:`<div class="col">${content}</div>`;
  document.querySelectorAll('[data-z]').forEach(r=>r.onclick=e=>{
    const id=+r.dataset.z, go=e.target.dataset.go;
    if(go==='srs'){toast(`SRS Analyzer ?zone=${id}${e.target.dataset.m?'&measurement='+e.target.dataset.m:''}`);return}
    if(go==='ms'){toast(`MotoSim ?zone=${id}`);return}
    if(tab==='over'){zoneSel=id;tab='comp';render();document.querySelector('tr.sel')?.scrollIntoView({block:'center'});return}
    zoneSel=zoneSel===id?null:id; render();
  });
  document.querySelectorAll('[data-zf]').forEach(b=>b.onclick=()=>{zf=b.dataset.zf;render()});
  document.querySelectorAll('.sub [data-sub]').forEach(b=>b.onclick=()=>{appSub=b.dataset.sub;render()});
  const zi=$('#zq'); if(zi){zi.oninput=()=>{zq=zi.value;const p=zi.selectionStart;render();const n=$('#zq');n.focus();n.setSelectionRange(p,p)}}
}
$('#q').oninput=renderList;
document.querySelectorAll('.chip[data-f]').forEach(c=>c.onclick=()=>{filter=c.dataset.f;document.querySelectorAll('.chip[data-f]').forEach(x=>x.classList.toggle('on',x===c));renderList()});
zoneSel=zonesOf(cur).find(z=>z.srs.length)?.id??null;
render();
</script>
</body>
</html>
