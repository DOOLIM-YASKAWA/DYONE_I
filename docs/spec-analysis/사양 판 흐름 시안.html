<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>사양 판 흐름 시안</title>
<style>
:root{
  --bg:#eef0f3; --card:#fff; --line:#e3e6eb; --text:#1d2330; --sub:#6b7280; --faint:#9aa1ad;
  --accent:#2457d6; --accent-soft:#e8eefc; --chg:#fff4c2; --chg-line:#e6c84a;
  --add:#e3f6e8; --add-text:#17803d; --del:#fde8e8; --del-text:#b42318; --warn:#fff1e6; --warn-text:#b54708;
  --ok:#e3f6e8; --ok-text:#17803d;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.55 "Pretendard","Malgun Gothic",system-ui,sans-serif}
.wrap{display:grid;grid-template-columns:270px 1fr;min-height:100vh}
@media (max-width:860px){.wrap{grid-template-columns:1fr}.side{position:static!important;height:auto!important}}

/* 왼쪽 단계 목록 */
.side{background:#1f2633;color:#d6dbe4;padding:16px 12px;position:sticky;top:0;height:100vh;overflow-y:auto}
.side h1{font-size:14px;margin:0 6px 2px;color:#fff}
.side .sub{font-size:11.5px;color:#9aa3b2;margin:0 6px 12px}
.phase{font-size:11px;color:#8b95a7;margin:14px 6px 4px;letter-spacing:.02em}
.st{display:flex;gap:8px;align-items:flex-start;padding:6px 8px;border-radius:7px;cursor:pointer;font-size:12.5px;line-height:1.4}
.st:hover{background:#2b3446}
.st.on{background:#2457d6;color:#fff}
.st.done{color:#aab3c2}
.st .no{flex:none;width:20px;height:20px;border-radius:50%;background:#384257;color:#cfd6e2;font-size:11px;display:grid;place-items:center;margin-top:1px}
.st.on .no{background:#fff;color:#2457d6;font-weight:700}
.st.done .no{background:#2f6b45;color:#c9f0d6}
.st .who{display:block;font-size:10.5px;opacity:.7}

/* 오른쪽 */
.main{display:flex;flex-direction:column;min-width:0}
.guide{background:#fff;border-bottom:1px solid var(--line);padding:14px 22px}
.guide .ph{font-size:11.5px;color:var(--accent);font-weight:700}
.guide h2{margin:2px 0 4px;font-size:17px}
.guide p{margin:0;color:#3d4554;font-size:13.5px}
.guide .look{margin-top:8px;background:var(--accent-soft);color:#27407e;border-radius:7px;padding:7px 10px;font-size:12.5px}
.nav{display:flex;gap:8px;align-items:center;margin-top:10px}
.nav .cnt{font-size:12px;color:var(--sub)}

/* 앱 화면 틀 */
.stage{padding:18px 22px 60px}
.app{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.bar{display:flex;align-items:center;gap:12px;padding:9px 16px;border-bottom:1px solid var(--line);background:#fbfbfc}
.logo{font-weight:800;font-size:13px;color:var(--accent)}
.crumb{font-size:12.5px;color:var(--sub)}
.bar .sp{flex:1}
.bell{position:relative;font-size:16px;cursor:default}
.bell .badge{position:absolute;top:-6px;right:-9px;background:#e5484d;color:#fff;border-radius:999px;font-size:10px;padding:0 5px;font-weight:700}
.me{font-size:12px;border:1px solid var(--line);border-radius:999px;padding:2px 10px;background:#fff}
.me b{color:var(--accent)}
.body{padding:16px 18px;position:relative}

.ptabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:-4px 0 14px;overflow-x:auto}
.ptab{padding:7px 12px;font-size:13px;color:var(--sub);border-bottom:2px solid transparent;white-space:nowrap}
.ptab.on{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}

/* 판 줄기 */
.track{display:grid;grid-template-columns:62px 1fr;row-gap:16px;align-items:center;margin:2px 0 14px;padding:10px 12px;border:1px solid var(--line);border-radius:9px;background:#fcfcfd}
.track .lab{font-weight:600;font-size:12px;color:var(--sub)}
.line{position:relative;display:flex;align-items:center;gap:56px}
.line::before{content:"";position:absolute;left:0;right:0;top:12px;height:2px;background:var(--line)}
.vv{position:relative;z-index:1;text-align:center}
.ver{display:inline-block;background:#fff;border:1.5px solid var(--line);border-radius:999px;padding:2px 11px;font-size:12px;white-space:nowrap}
.ver.sel{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:600}
.ver.ghost{border-style:dashed;color:var(--faint)}
.vv small{display:block;font-size:10.5px;color:var(--faint)}

/* 공통 요소 */
.btn{display:inline-block;border:1px solid var(--line);background:#fff;border-radius:7px;padding:5px 11px;font-size:12.5px;color:var(--text);white-space:nowrap}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.hl{outline:3px solid #ffb02e;outline-offset:2px}
.btn.mini{font-size:11.5px;padding:2px 8px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sum{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;align-items:center}
.big{font-size:14.5px;font-weight:600;margin-right:4px}
.chip{border-radius:999px;padding:1px 9px;font-size:11.5px;background:var(--line);white-space:nowrap}
.chip.c{background:var(--chg);border:1px solid var(--chg-line)}
.chip.a,.chip.ok{background:var(--add);color:var(--add-text)}
.chip.d{background:var(--del);color:var(--del-text)}
.chip.w{background:var(--warn);color:var(--warn-text)}
.chip.b{background:var(--accent-soft);color:var(--accent)}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th,td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
th{background:#fafbfc;color:var(--sub);font-weight:600;font-size:11.5px;white-space:nowrap}
td.k{font-weight:600;white-space:nowrap;width:120px}
td.y{background:var(--chg);box-shadow:inset 3px 0 0 var(--chg-line)}
td.e{box-shadow:inset 3px 0 0 #8aa8f0}
td.need{color:var(--warn-text);background:var(--warn)}
tr.same td{color:var(--faint)}
tr.dim td{opacity:.35}
.old{color:var(--del-text);text-decoration:line-through}
.new{font-weight:600}
.pg{color:var(--accent);font-size:11.5px;white-space:nowrap}
.dept{display:inline-block;font-size:11px;border:1px solid var(--line);border-radius:5px;padding:0 5px;margin:1px 2px 1px 0;color:var(--sub);white-space:nowrap;background:#fff}
.why{display:block;font-size:11.5px;color:#7a5d00;margin-top:3px}
.flag{display:block;font-size:11.5px;color:var(--warn-text);background:var(--warn);border-radius:5px;padding:3px 7px;margin-top:4px}
.mark{display:block;font-size:10.5px;color:#4b67b8;margin-top:2px}
.muted{color:var(--faint);font-size:11.5px}
.tag{font-size:10.5px;border-radius:5px;padding:1px 6px;white-space:nowrap}
.tag.c{background:var(--chg)}.tag.a{background:var(--add);color:var(--add-text)}.tag.d{background:var(--del);color:var(--del-text)}.tag.w{background:var(--warn);color:var(--warn-text)}

.drop{border:2px dashed #c4ccd8;border-radius:10px;padding:18px;text-align:center;color:var(--sub);font-size:13px;margin-bottom:12px}
.file{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:8px;padding:8px 12px;margin-bottom:6px;font-size:12.5px}
.file .ic{width:28px;height:32px;border-radius:4px;background:#e5484d;color:#fff;font-size:9.5px;display:grid;place-items:center;font-weight:700}
.file .ic.p{background:#d9822b}
.file .nm{flex:1;min-width:0}
.file .nm small{display:block;color:var(--faint)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.box{border:1px solid var(--line);border-radius:9px;padding:10px 12px;background:#fff}
.box h3{margin:0 0 6px;font-size:13px;display:flex;align-items:center;gap:6px}
.box ul{margin:0;padding-left:16px}.box li{font-size:12px;margin:3px 0}
.box.me{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}

/* 모달 · 알림함 */
.dim-bg{position:absolute;inset:0;background:rgba(20,26,38,.35);display:flex;align-items:flex-start;justify-content:center;padding-top:26px;z-index:5}
.modal{background:#fff;border-radius:12px;width:min(620px,94%);box-shadow:0 10px 30px rgba(0,0,0,.2);overflow:hidden}
.modal .mh{padding:12px 16px;border-bottom:1px solid var(--line);font-weight:700}
.modal .mb{padding:12px 16px;font-size:13px}
.modal .mf{padding:10px 16px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;background:#fafbfc}
.field{margin-bottom:10px}
.field label{display:block;font-size:11.5px;color:var(--sub);margin-bottom:3px}
.inp{border:1px solid var(--line);border-radius:6px;padding:6px 9px;font-size:13px;background:#fff}
.who-row{display:grid;grid-template-columns:22px 130px 1fr;gap:6px;align-items:start;padding:6px 0;border-bottom:1px solid var(--line);font-size:12.5px}
.who-row:last-child{border-bottom:none}
.cb{width:15px;height:15px;border:1.5px solid var(--accent);border-radius:3px;background:var(--accent);color:#fff;font-size:10px;display:grid;place-items:center;margin-top:2px}
.cb.off{background:#fff}
.inbox{position:absolute;right:14px;top:4px;width:min(400px,92%);background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.18);z-index:6;overflow:hidden}
.inbox .ih{padding:9px 12px;font-weight:700;font-size:13px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between}
.noti{padding:9px 12px;border-bottom:1px solid var(--line);font-size:12.5px}
.noti.unread{background:#f5f8ff}
.noti b{display:block;font-size:12.5px}
.noti .t{font-size:10.5px;color:var(--faint)}
.noti ul{margin:4px 0 0;padding-left:16px;color:#3d4554}
.under{opacity:.45;pointer-events:none}

.matrix td,.matrix th{text-align:center}
.matrix td.k{text-align:left}
.st-ok{color:var(--ok-text);font-weight:600}.st-wait{color:var(--sub)}.st-q{color:var(--warn-text);font-weight:600}
.cmt{border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-top:8px;font-size:12.5px;background:#fbfbfc}
.cmt b{font-size:12px}.cmt .t{font-size:10.5px;color:var(--faint);margin-left:4px}
.cmt.re{margin-left:22px;background:#fff}
textarea.inp{width:100%;min-height:58px;font-family:inherit}
</style>
</head>
<body>
<div class="wrap">
  <aside class="side">
    <h1>사양 판 흐름 시안</h1>
    <p class="sub">현대 아산 중도 Door 내판 (DLP-25-274) 실제 값으로 따라가 보는 시나리오</p>
    <div id="steps"></div>
  </aside>
  <div class="main">
    <div class="guide">
      <div class="ph" id="gPh"></div>
      <h2 id="gTitle"></h2>
      <p id="gText"></p>
      <div class="look" id="gLook"></div>
      <div class="nav"><button class="btn" id="prev">← 이전</button><button class="btn pri" id="next">다음 →</button><span class="cnt" id="cnt"></span><span class="cnt">· 키보드 ← → 로도 넘깁니다</span></div>
    </div>
    <div class="stage"><div class="app">
      <div class="bar"><span class="logo">DY ONE</span><span class="crumb" id="crumb"></span><span class="sp"></span>
        <span class="bell">🔔<span class="badge" id="badge"></span></span><span class="me" id="me"></span></div>
      <div class="body" id="screen"></div>
    </div></div>
  </div>
</div>
<script>
// ── 공용 조각 ──────────────────────────────────────────
const P = (on) => `<div class="ptabs">${['개요','문서','사양서 분석','사양정리','부서별 확인','판 비교'].map(t=>`<span class="ptab ${t===on?'on':''}">${t}</span>`).join('')}</div>`;
// 판 줄기: specs/sums = [[이름, 아래글, 'sel'|'ghost'|'' ]]
const T = (specs, sums) => `<div class="track">
  <div class="lab">사양서</div><div class="line">${specs.map(([n,s,c])=>`<span class="vv"><span class="ver ${c||''}">${n}</span><small>${s}</small></span>`).join('')}</div>
  <div class="lab">사양정리</div><div class="line">${sums.length?sums.map(([n,s,c])=>`<span class="vv"><span class="ver ${c||''}">${n}</span><small>${s}</small></span>`).join(''):'<span class="muted" style="position:relative;z-index:1;background:#fcfcfd;padding-right:6px">아직 저장한 판 없음</span>'}</div></div>`;
const D = n => `<span class="dept">${n}</span>`;
const who = (on, name, what) => `<div class="who-row"><span class="cb ${on?'':'off'}">${on?'✓':''}</span><b>${name}</b><span>${what}</span></div>`;
const modal = (title, body, foot) => `<div class="dim-bg"><div class="modal"><div class="mh">${title}</div><div class="mb">${body}</div><div class="mf">${foot}</div></div></div>`;

// 사양정리 칸 (시나리오 rev1 = V2 기준)
const R1 = {
  'Robot':'스프레이: MPX3500 * 2ea, 오프너: MPX2600 * 2ea (FRT · RR 각각)',
  'Booth size':'20,700(L) * 6,000(W) * 4,500(H) — 입구 부스 연장 5m 시 24,700(L)',
  'Basic Condition':'75 UPH(MAX) / Floor Conveyor(연속) 8.28m/min / 사이클타임 48초 / 바디 피치 6,900',
  'Body Size':'차종 : DN8 FL, GN7, GN7개조, CE, CE개조, ME + 옵션',
  'Utility':'Power : AC 400V(±10%)×3Φ×(50Hz±5%) / Compressed Air : 6~8 Bar',
  'Tracking rail':'4R1C * 2ea (기존 9.5M 2R1C * 4ea)',
  'Atomizer':'SAMES PPH707 SB : 2 (유성 내부하전 정전벨) / REGULATOR + AA + AO',
  'Color(CCV)':'CCV: 24개(20칼라+4스페어), Crystal 세정장치 적용',
  'FGP':'PSMP 5cc FGP',
  'Panel':'FRT 1MCP/4RC/2AP/1OP/1VSP · RR 1MCP/4RC/4AP/1OP/1VSP',
  'System':'PLC: MITSUBISHI (MELSEC-Q), 라인제어 세이프티 PLC',
  'Training':'2주 * 2회 (보전/생산) – 교육 센터',
  'Schedule':"'26 6월 OLT → '26 8월(하계 셧다운) 설치 → '26 8월 9일 SOP",
  'Stand by':'제어 1 & 기계 1 * 2 shift * 4주 / 티쳐 1 * 2 shift * 3주',
  'Others':'입/출구 라이트 커튼, 안전펜스(메쉬·플랩도어), 모니터링 시스템, 로봇 자켓, UPS(OP), 입구 부스 연장 5m',
};
const sheet = (rows, opt={}) => `<div class="tw"><table><thead><tr><th>칸</th><th>값</th>${opt.col?`<th>${opt.col}</th>`:''}</tr></thead><tbody>${
  Object.entries(rows).map(([k,v])=>{const o=(opt.cell||{})[k]||{};return `<tr class="${o.tr||''}"><td class="k">${k}</td><td class="${o.cls||''}">${v}${o.note||''}</td>${opt.col?`<td>${o.side||''}</td>`:''}</tr>`}).join('')}</tbody></table></div>`;

// ── 단계 ──────────────────────────────────────────────
const S = [
// 1단계
{ph:'1단계 · 처음 올릴 때', who:'영업부', title:'사양서 V2를 프로젝트 문서에 올린다', crumb:'프로젝트 › 현대 아산 중도 Door 내판 로봇 교체 › 문서', bell:0,
 text:'영업부가 고객에게서 받은 사양서(V2, 2025-11-05)를 프로젝트 문서에 올립니다. 분류는 이름을 보고 "사양서"로 자동으로 고릅니다.',
 look:'확인할 것: 올리는 곳은 지금 프로젝트 문서 화면과 같습니다. 새로 생기는 것은 오른쪽의 [사양서 분석] 버튼 하나입니다.',
 html:()=>P('문서')+`<div class="drop">여기에 파일을 끌어다 놓거나 <b>파일 선택</b></div>
  <div class="file"><span class="ic">PDF</span><span class="nm">설비사양서]아산)도장 중도 도어내판 로봇 노후교체_V2_251105.pdf<small>3.1MB · 분류: 사양서 (자동) · 방금 올림 · 영업부</small></span><span class="btn pri hl">사양서 분석</span></div>
  <div class="file" style="opacity:.6"><span class="ic p">PPT</span><span class="nm">★아산 도장 중도 도어 내판 로봇 노후 교체 사양설명회_251113_v2.pdf<small>분류: 회의·설명회</small></span></div>`},

{ph:'1단계 · 처음 올릴 때', who:'영업부', title:'사양정리 초안이 만들어진다', crumb:'프로젝트 › … › 사양정리', bell:0,
 text:'사양서를 읽어 영업부 양식(V5)의 칸을 채웁니다. 사양서에 없는 칸은 비워 두고, 모델은 이력에서 후보를 붙입니다. 여기까지는 지금 있는 기능입니다.',
 look:'확인할 것: 판 줄기에 사양서 V2만 있고, 사양정리는 아직 저장한 판이 없습니다. 초안은 고칠 수 있는 작업본일 뿐 기록이 아닙니다.',
 html:()=>P('사양정리')+T([['V2','11/05 · 지금','sel']],[])+
  `<div class="sum"><span class="big">사양정리 초안 (V2 기준)</span><span class="chip w">확인 필요 2칸</span><span class="chip b">모델 후보 3자리</span><span class="sp" style="flex:1"></span><span class="btn">pptx 내려받기</span></div>`+
  sheet({...R1,'Tracking rail':'주행레일 레일길이 11.5m','Panel':'(사양서에 없음 — 확인 필요)','Stand by':'(사양서에 없음 — 확인 필요)'},
   {cell:{'Panel':{cls:'need'},'Stand by':{cls:'need'},'Robot':{note:'<span class="mark">모델: 이력 후보에서 MPX3500 채택</span>'}}})},

{ph:'1단계 · 처음 올릴 때', who:'영업부', title:'부서별 확인 항목이 정리된다', crumb:'프로젝트 › … › 부서별 확인', bell:0,
 text:'사양서에서 부서마다 꼭 봐야 할 문장을 골라 부서 카드로 보여 줍니다(지금 있는 146개 확인 항목). 이 결과가 나중에 "어느 부서에 알릴지"의 기준이 됩니다.',
 look:'확인할 것: 카드마다 "사양정리 칸"이 붙어 있습니다. 예를 들어 설계팀은 Booth·Utility·Panel 칸에 걸립니다. 이 연결로 바뀐 칸 → 알릴 부서가 정해집니다.',
 html:()=>P('부서별 확인')+`<div class="grid">
  <div class="box"><h3>설계팀 <span class="chip">7</span></h3><ul><li>입구 부스 연장 5m, 레일연장용 하부보강 <span class="pg">p3</span></li><li>주행레일 11.5m <span class="pg">p2</span></li><li>부스 내 방폭사양 <span class="pg">p16</span></li></ul><div class="muted" style="margin-top:6px">사양정리 칸: Booth · Utility · Panel · Robot</div></div>

// ── 그리기 ────────────────────────────────────────────
let cur = 0;
const stepsEl = document.getElementById('steps');
function drawSide(){
  let last = '', h = '';
  S.forEach((s,i)=>{
    if (s.ph!==last){ h += `<div class="phase">${s.ph}</div>`; last = s.ph; }
    h += `<div class="st ${i===cur?'on':i<cur?'done':''}" data-i="${i}"><span class="no">${i<cur?'✓':i+1}</span><span>${s.title}<span class="who">${s.who} 화면</span></span></div>`;
  });
  stepsEl.innerHTML = h;
  stepsEl.querySelectorAll('.st').forEach(e=>e.onclick=()=>go(+e.dataset.i));
}
function go(i){
  cur = Math.max(0, Math.min(S.length-1, i)); const s = S[cur];
  document.getElementById('gPh').textContent = `${s.ph} · ${cur+1} / ${S.length}`;
  document.getElementById('gTitle').textContent = s.title;
  document.getElementById('gText').textContent = s.text;
  document.getElementById('gLook').textContent = s.look;
  document.getElementById('crumb').textContent = s.crumb;
  document.getElementById('me').innerHTML = `보는 사람: <b>${s.who}</b>`;
  const b = document.getElementById('badge'); b.textContent = s.bell||''; b.style.display = s.bell?'':'none';
  document.getElementById('screen').innerHTML = s.html();
  document.getElementById('prev').disabled = cur===0;
  document.getElementById('next').textContent = cur===S.length-1 ? '처음으로' : '다음 →';
  document.getElementById('cnt').textContent = `${cur+1} / ${S.length}`;
  drawSide();
  try { history.replaceState(null,'','#'+(cur+1)); } catch(e) {}
  window.scrollTo({top:0});
}
document.getElementById('prev').onclick = ()=>go(cur-1);
document.getElementById('next').onclick = ()=>go(cur===S.length-1?0:cur+1);
document.addEventListener('keydown', e=>{ if(e.key==='ArrowRight') go(cur+1); if(e.key==='ArrowLeft') go(cur-1); });
go((parseInt(location.hash.slice(1))||1)-1);
</script>
